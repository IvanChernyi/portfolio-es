<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="920" height="640" fill="#ffffff"/>

  <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1c1e21">portfolio-es — hexagonal view</text>
  <text x="460" y="54" text-anchor="middle" fill="#6b7280">inside: what the business says · on the edge: sockets (interfaces) · outside: plugs (implementations)</text>

  <!-- side labels -->
  <text x="130" y="110" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">driving side — who calls the core</text>
  <text x="790" y="110" text-anchor="middle" font-size="12" fill="#6b7280" font-style="italic">driven side — what the core calls</text>

  <!-- outer hexagon: app layer -->
  <polygon points="650,300 550,127 350,127 250,300 350,473 550,473" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="152" text-anchor="middle" font-weight="600" fill="#3730a3">app layer · commands/account.ts</text>
  <text x="450" y="170" text-anchor="middle" font-size="12" fill="#4338ca">loadAccount · priceOrder · deposit · withdraw · buy · sell</text>
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#4338ca">feeds the deps · works only through interfaces · async stops here</text>

  <!-- inner hexagon: domain -->
  <polygon points="565,300 507,200 393,200 335,300 393,400 507,400" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="450" y="262" text-anchor="middle" font-weight="600" fill="#065f46">domain · pure</text>
  <text x="450" y="284" text-anchor="middle" font-size="12" fill="#047857">Account (aggregate) · Position · StockOrder</text>
  <text x="450" y="302" text-anchor="middle" font-size="12" fill="#047857">DepositCollected · WithdrawalSent</text>
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#047857">StockBought · StockSold</text>
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#047857">foldAccountEvents · collectDeposit</text>
  <text x="450" y="356" text-anchor="middle" font-size="12" fill="#047857">sendWithdrawal · buyStock · sellStock</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#059669">no clock · no ids · no I/O · no Promise</text>

  <!-- ports (sockets) on the outer edge -->
  <g>
    <rect x="195" y="282" width="110" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="250" y="298" text-anchor="middle" font-size="11" fill="#3730a3">socket</text>
    <text x="250" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">command functions</text>
  </g>
  <g>
    <rect x="540" y="178" width="120" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="600" y="194" text-anchor="middle" font-size="11" fill="#3730a3">socket · domain/eventStore.ts</text>
    <text x="600" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">EventStore</text>
  </g>
  <g>
    <rect x="540" y="386" width="120" height="36" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="600" y="402" text-anchor="middle" font-size="11" fill="#3730a3">socket · domain/priceSource.ts</text>
    <text x="600" y="416" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">PriceSource</text>
  </g>

  <!-- driving adapters (left) -->
  <g>
    <rect x="40" y="150" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="130" y="167" text-anchor="middle" font-weight="600" fill="#1c1e21">UI · public/index.html</text>
    <text x="130" y="182" text-anchor="middle" font-size="11" fill="#6b7280">forms, event list, report</text>
  </g>
  <g>
    <rect x="40" y="240" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="130" y="257" text-anchor="middle" font-weight="600" fill="#1c1e21">HTTP · http/app.ts</text>
    <text x="130" y="272" text-anchor="middle" font-size="11" fill="#6b7280">zod at the edge · one reply()</text>
  </g>
  <g>
    <rect x="40" y="330" width="180" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="130" y="347" text-anchor="middle" font-weight="600" fill="#1c1e21">tests/commands.test.ts</text>
    <text x="130" y="362" text-anchor="middle" font-size="11" fill="#6b7280">calls the same functions</text>
  </g>
  <line x1="130" y1="190" x2="130" y2="238" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="262" x2="245" y2="286" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="348" x2="245" y2="316" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- driven adapters (right) -->
  <g>
    <rect x="700" y="140" width="190" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="795" y="157" text-anchor="middle" font-weight="600" fill="#1c1e21">SqlEventStore</text>
    <text x="795" y="172" text-anchor="middle" font-size="11" fill="#6b7280">storage/ · node:sqlite · zod on read</text>
  </g>
  <g>
    <rect x="700" y="210" width="190" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="795" y="227" text-anchor="middle" font-weight="600" fill="#1c1e21">InMemoryEventStore</text>
    <text x="795" y="242" text-anchor="middle" font-size="11" fill="#6b7280">storage/ · for tests, not a mock</text>
  </g>
  <g>
    <rect x="700" y="350" width="190" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="795" y="367" text-anchor="middle" font-weight="600" fill="#1c1e21">AlpacaPriceSource</text>
    <text x="795" y="382" text-anchor="middle" font-size="11" fill="#6b7280">marketdata/ · the only file that knows Alpaca</text>
  </g>
  <g>
    <rect x="700" y="420" width="190" height="40" rx="8" fill="#f6f7f9" stroke="#9ca3af"/>
    <text x="795" y="437" text-anchor="middle" font-weight="600" fill="#1c1e21">FixedPriceSource</text>
    <text x="795" y="452" text-anchor="middle" font-size="11" fill="#6b7280">marketdata/ · offline and tests</text>
  </g>
  <!-- plugs implement sockets: arrows point at the socket -->
  <line x1="700" y1="166" x2="662" y2="190" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="700" y1="226" x2="662" y2="206" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="700" y1="376" x2="662" y2="398" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="700" y1="434" x2="662" y2="414" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="680" y="300" text-anchor="middle" font-size="11" fill="#6b7280">implements</text>

  <!-- read side -->
  <g>
    <rect x="310" y="510" width="280" height="44" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="450" y="528" text-anchor="middle" font-weight="600" fill="#9a3412">read side · projections/positionsReport.ts</text>
    <text x="450" y="544" text-anchor="middle" font-size="11" fill="#c2410c">positionsFrom (pure) → positions_report table</text>
  </g>
  <path d="M600,422 L600,470 L470,470 L470,508" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="540" y="464" text-anchor="middle" font-size="11" fill="#6b7280">reads events</text>
  <path d="M130,370 L130,532 L308,532" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="526" text-anchor="middle" font-size="11" fill="#6b7280">UI shows the report</text>

  <!-- composition root -->
  <rect x="40" y="580" width="840" height="36" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="460" y="596" text-anchor="middle" font-weight="600" fill="#92400e">main.ts · composition root</text>
  <text x="460" y="610" text-anchor="middle" font-size="11" fill="#b45309">the only file that names a plug, a file on disk, the clock or an env var · picks Alpaca or the fixed table · wires plugs into sockets · app.listen</text>
</svg>
